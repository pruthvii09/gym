        checkin_radius_meters:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusA3eEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - checkin_radius_meters
      - city
      - country
      - created_at
      - description
      - id
      - latitude
      - longitude
      - name
      - postal_code
      - state
      - status
      - updated_at
    GymCreate:
      type: object
      description: |-
        Member-facing self-service gym creation -- see services.create_owned_gym.
        Deliberately omits `status`: a self-created gym is always active on
        creation (the model's own default); only admins can later deactivate one
        (AdminGymSerializer / PATCH /admin/gyms/{id}/).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        checkin_radius_meters:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - address
      - city
      - country
      - id
      - latitude
      - longitude
      - name
    GymMembership:
      type: object
      description: |-
        Backs GET /api/v1/me/gym-memberships/ -- the member-facing "which
        gyms am I in" list that has no equivalent elsewhere (only the
        is_staff-gated admin API can list memberships otherwise).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        gym:
          allOf:
          - $ref: '#/components/schemas/Gym'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusA3eEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - gym
      - id
      - role
      - status
    Login:
      type: object
      properties:
        device_hash:
          type: string
          maxLength: 255
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - read_at
      - title
      - type
    NotificationTypeEnum:
      enum:
