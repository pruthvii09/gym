components:
  schemas:
    AdminCheckIn:
      type: object
      description: |-
        Unlike the member-facing CheckinSerializer, admins ARE shown
        risk_score -- the "don't hand out a tuning oracle" reasoning only
        applies to the client whose own behavior is being scored.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        gym:
          type: string
          format: uuid
          readOnly: true
        gym_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusE34Enum'
          readOnly: true
        verification_method:
          allOf:
          - $ref: '#/components/schemas/VerificationMethodEnum'
          readOnly: true
        risk_score:
          type: integer
          readOnly: true
        checked_in_at:
          type: string
          format: date-time
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        location_accuracy:
          type: integer
          readOnly: true
          nullable: true
        idempotency_key:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - checked_in_at
      - created_at
      - gym
      - gym_name
      - id
      - idempotency_key
      - latitude
      - location_accuracy
      - longitude
      - risk_score
      - status
      - user
      - user_email
      - verification_method
