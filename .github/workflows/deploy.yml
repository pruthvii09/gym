name: Deploy

# Builds both images on GitHub's runners (not the tiny EC2 box), pushes them
# to GHCR, then tells the server to pull + restart. See DEPLOY.md for the
# one-time EC2/secrets setup this depends on.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_api: ${{ steps.vars.outputs.image_api }}
      image_web: ${{ steps.vars.outputs.image_web }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names (GHCR requires lowercase)
        id: vars
        run: |
          echo "image_api=$(echo "ghcr.io/${{ github.repository }}-api" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_web=$(echo "ghcr.io/${{ github.repository }}-web" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image (Django)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_api }}:latest
            ${{ steps.vars.outputs.image_api }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push web image (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          # NEXT_PUBLIC_* vars are baked into the client bundle at build
          # time -- set this as a repo Variable (Settings > Secrets and
          # variables > Actions > Variables), e.g. http://<elastic-ip> or
          # https://yourdomain.com. Must match how the browser reaches the
          # app, since Caddy proxies /api same-origin.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ steps.vars.outputs.image_web }}:latest
            ${{ steps.vars.outputs.image_web }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.prod.yml / Caddyfile are kept in sync with the repo
      # on every deploy. .env stays server-only and is never touched here.
      - name: Copy deploy files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "~/gymstreak"

      - name: Pull new images and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/gymstreak
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
